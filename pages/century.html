<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>古プリ比較システム｜世紀別</title>
<link rel="icon" href="../assets/icons/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png"><link rel="manifest" href="../manifest.json">
<style>
:root{--bg:#f5f3ee;--panel:#fff;--ink:#25231f;--sub:#6f6a61;--line:#ddd7cd;--accent:#de6f3c;--green:#16866f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:max(14px,env(safe-area-inset-top)) 16px 14px}.head{max-width:1000px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.siteBrand{display:inline-flex;align-items:center;gap:9px;color:inherit;text-decoration:none;font-size:20px;font-weight:900;white-space:nowrap}.siteBrand img{width:32px;height:32px;border-radius:8px;object-fit:cover;flex:0 0 auto}.modeNav{margin-left:auto;display:flex;background:#eeeae3;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}.modeNav a,.modeNav span{text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;padding:7px 11px;border-radius:9px;white-space:nowrap}.modeNav .active{background:#fff;box-shadow:0 2px 8px rgba(34,28,20,.08);color:var(--accent)}main{max-width:1000px;margin:auto;padding:20px 16px 48px}.back{display:inline-block;color:var(--sub);font-weight:800;text-decoration:none;margin-bottom:13px}h1{font-size:clamp(27px,6vw,40px);margin:0}.range{color:var(--green);font-weight:800;margin:7px 0 18px}.switcher{display:grid;grid-template-columns:1fr 1fr;background:#e9e5de;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:18px}.switcher button{border:0;border-radius:10px;background:transparent;color:var(--ink);font-weight:900;padding:11px;cursor:pointer}.switcher button.active{background:#fff;color:var(--accent);box-shadow:0 2px 9px rgba(34,28,20,.09)}.panel[hidden]{display:none}.lead{color:var(--sub);line-height:1.7;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-top:5px solid var(--card-accent,var(--accent));border-radius:15px;padding:15px;box-shadow:0 7px 22px rgba(34,28,20,.06)}.cardTop{display:flex;gap:8px;align-items:center}.name{font-size:18px;font-weight:900}.count{margin-left:auto;color:var(--sub);background:#f3f1ed;border-radius:999px;padding:5px 8px;font-size:12px}.openAll{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#25231f;color:#fff;border-radius:15px;padding:16px;text-decoration:none;font-weight:900;margin-bottom:17px}.openAll small{font-weight:600;opacity:.75}.decades{display:grid;gap:8px}.decade{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-decoration:none;color:inherit}.decadeName{font-weight:900}.decade .count{margin-left:auto}.empty{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--sub)}
@media(max-width:620px){.modeNav{width:100%;margin-left:0}.modeNav a,.modeNav span{flex:1;text-align:center;font-size:12px;padding-inline:5px}.grid{grid-template-columns:1fr 1fr}.card{padding:12px}.name{font-size:15px}}
</style>
</head>
<body><header><div class="head"><a class="siteBrand" href="../index.html" aria-label="古プリ比較システムのトップページ"><img src="../assets/icons/icon-192.png" alt=""><span>古プリ比較システム</span></a><nav class="modeNav" aria-label="閲覧方法"><a href="../index.html">ナンバー順</a><a href="regional.html">地域・時代順</a><span class="active" aria-current="page">世紀別</span><a href="search.html">文字検索</a></nav></div></header>
<main><a class="back" href="centuries.html">← 世紀一覧</a><h1 id="title">読み込み中…</h1><div class="range" id="range"></div><div class="switcher" role="tablist" aria-label="世紀内の閲覧方法"><button id="regionTab" class="active" role="tab" aria-selected="true">地域別</button><button id="timelineTab" role="tab" aria-selected="false">完全時代順</button></div><section class="panel" id="regionPanel"><p class="lead">この世紀に関係するプリントを、地域ごとに表示します。複数地域に関係するページは各地域に掲載されます。</p><div class="grid" id="regionGrid"></div></section><section class="panel" id="timelinePanel" hidden><p class="lead">地域を分けず、同じ時期の世界各地の出来事を年代順に一本で並べます。</p><a class="openAll" id="openAll" href="#"><span>完全時代順で開く<br><small id="allMeta"></small></span><span>→</span></a><div class="decades" id="decades"></div></section><div class="empty" id="error" hidden>世紀データを読み込めませんでした。</div></main>
<script>
const REGIONS=[['east-asia','東アジア','#b94f3d'],['southeast-asia','東南アジア','#c36b2d'],['south-asia','南アジア','#a06b22'],['central-asia','中央アジア','#7e6d2f'],['west-asia','西アジア・イスラーム','#6f7540'],['europe','ヨーロッパ','#366f88'],['africa','アフリカ','#2f7b65'],['americas','アメリカ','#5d5f9f'],['oceania','オセアニア','#477aa0']];const params=new URLSearchParams(location.search),cid=params.get('century'),regionTab=document.getElementById('regionTab'),timelineTab=document.getElementById('timelineTab'),regionPanel=document.getElementById('regionPanel'),timelinePanel=document.getElementById('timelinePanel');function setTab(mode){const timeline=mode==='timeline';regionPanel.hidden=timeline;timelinePanel.hidden=!timeline;regionTab.classList.toggle('active',!timeline);timelineTab.classList.toggle('active',timeline);regionTab.setAttribute('aria-selected',String(!timeline));timelineTab.setAttribute('aria-selected',String(timeline));history.replaceState(null,'',`${location.pathname}?century=${encodeURIComponent(cid)}${timeline?'#timeline':''}`)}regionTab.onclick=()=>setTab('region');timelineTab.onclick=()=>setTab('timeline');async function boot(){const response=await fetch('../assets/century-view/century-classification.json',{cache:'no-cache'});if(!response.ok)throw new Error(response.status);const data=await response.json(),century=data.centuries.find(item=>item.id===cid);if(!century)throw new Error('invalid century');document.title=`古プリ 世紀別｜${century.label}`;document.getElementById('title').textContent=century.label;document.getElementById('range').textContent=century.rangeLabel;document.getElementById('regionGrid').innerHTML=REGIONS.filter(([id])=>century.regionCounts[id]).map(([id,name,color])=>`<a class="card" style="--card-accent:${color}" href="centuries/view.html?century=${encodeURIComponent(cid)}&region=${encodeURIComponent(id)}"><div class="cardTop"><span class="name">${name}</span><span class="count">${century.regionCounts[id]}ページ</span></div></a>`).join('');document.getElementById('openAll').href=`centuries/view.html?century=${encodeURIComponent(cid)}&mode=all`;document.getElementById('allMeta').textContent=`${century.pages}ページ・地域横断`;document.getElementById('decades').innerHTML=century.decades.map(d=>`<a class="decade" href="centuries/view.html?century=${encodeURIComponent(cid)}&mode=all&decade=${d.startYear}"><span class="decadeName">${d.label}</span><span class="count">${d.pages}ページ</span><span>→</span></a>`).join('');if(location.hash==='#timeline')setTab('timeline')}boot().catch(()=>{document.getElementById('error').hidden=false;regionPanel.hidden=true;timelinePanel.hidden=true;document.getElementById('title').textContent='世紀が見つかりません';document.getElementById('range').textContent=''})
</script></body></html>
