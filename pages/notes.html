<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>メモ一覧｜古プリ比較システム</title><link rel="icon" href="../assets/icons/favicon.ico"><link rel="stylesheet" href="../assets/review/review_v3.css"></head>
<body class="kr-manager"><main>
<a href="../index.html">← 古プリ一覧</a><nav class="kn-nav"><a href="review.html">復習管理</a><a href="notes.html" aria-current="page">メモ一覧</a></nav>
<h1>メモ一覧</h1><p>覚え方や補足を、自分専用のメモに。プリント上で対象を選び「メモを書く」から追加できます。</p>
<section class="kr-card"><div id="account" class="kr-row"></div><p id="status" class="kr-status" role="status" aria-live="polite">読み込み中…</p><p id="notice" class="kr-error" role="alert"></p><div id="stats" class="kr-stats"></div></section>
<section id="conflict" class="kr-conflict kn-conflict" hidden><h2>別端末のメモと競合しています</h2><p id="conflictTitle"></p><p>両方の内容を確認してください。下の入力欄で内容をまとめてから保存することもできます。</p><label>この端末の未送信内容<textarea id="localBody" maxlength="6000"></textarea></label><p id="deleteConflict" hidden>この端末ではメモの削除を待っています。</p><button id="serverRead">サーバーのメモを確認</button><pre id="serverBody"></pre><div class="kr-row"><button id="apply">入力内容を保存</button><button id="discard">サーバー側を採用</button></div></section>
<div class="kr-row"><label class="kn-search">メモを検索<input id="query" type="search" placeholder="メモ本文・語句から検索"></label>
<label>対象<select id="kind"><option value="all">すべて</option><option value="print">No.全体</option><option value="page">ページ</option><option value="word">語句</option><option value="range">指定範囲</option></select></label>
<label>No.<input id="no" type="number" min="0" max="9999" placeholder="すべて" style="width:100px"></label>
<label>並び順<select id="sort"><option value="updated">更新日が新しい順</option><option value="no">No.順</option><option value="created">作成日が新しい順</option></select></label></div>
<p id="count" class="kr-meta"></p><section id="list" aria-label="メモ一覧"></section><button id="more" hidden>さらに表示</button>
</main><script type="module" src="../assets/review/notes_manager_v8.js"></script></body></html>
