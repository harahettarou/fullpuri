<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Googleで再ログイン｜古プリ</title>
<link rel="stylesheet" href="../assets/review/review_v3.css">
</head>
<body class="kr-manager">
<main>
<h1>古プリに再ログイン</h1>
<p>以前連携したGoogleアカウントを選ぶと、保存済みの復習・メモに戻れます。</p>
<button type="button" id="google" disabled>Googleで再ログイン</button>
<p id="status" role="status">読み込み中…</p>
<a href="review.html">復習管理へ戻る</a>
</main>
<script type="module">
const button = document.getElementById('google');
const status = document.getElementById('status');
try {
 const { login } = await import('../assets/review/core_v12.js?entry=google-relogin-v1');
 button.onclick = async () => {
  button.disabled = true;
  status.textContent = 'Googleのログイン画面を開いています…';
  try {
   await login('google');
  } catch (error) {
   status.textContent = error.message;
   button.disabled = false;
  }
 };
 button.disabled = false;
 status.textContent = '';
} catch {
 status.textContent = 'ログイン画面を準備できませんでした。ページを開き直してください。';
}
</script>
</body>
</html>
