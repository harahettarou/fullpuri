<style>
:root{
  --bg:#f5f3ee;--panel:#fff;--ink:#25231f;--sub:#6f6a61;--line:#ddd7cd;
  --accent:#de6f3c;--green:#16866f;--shadow:0 12px 35px rgba(34,28,20,.12)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;overflow:hidden}
button,select,input{font:inherit}
button{cursor:pointer}
.app{height:100dvh;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:max(9px,env(safe-area-inset-top)) 12px 9px;
  display:flex;gap:10px;align-items:center;z-index:20
}
.siteBrand{display:inline-flex;align-items:center;gap:7px;color:inherit;text-decoration:none;font-weight:800;white-space:nowrap}.siteBrand img{width:30px;height:30px;border-radius:7px;object-fit:cover;flex:0 0 auto}
.homeBtn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700;white-space:nowrap}.regionTitle{font-size:14px;font-weight:800;white-space:nowrap}
.privacy{font-size:12px;color:var(--green);background:#e8f6f1;border-radius:999px;padding:5px 9px}
.topspacer{flex:1}
.main{min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr);width:100%}
.main.sideClosed{display:grid;grid-template-columns:minmax(0,1fr);width:100%;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}
.main.sideClosed .side{display:none}
.main.sideClosed .viewer{width:100%;min-width:0;min-height:0;height:100%;overflow:hidden}
.main.sideClosed .scroller{width:100%;justify-content:flex-start;cursor:grab}
.main.sideClosed .stage{margin-inline:auto}
.sideHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.sideHead .sectionTitle{margin:0}
.sideToggleBtn{white-space:nowrap}
.sectionTitle{font-weight:800;margin:4px 0 10px}
.help{font-size:13px;line-height:1.65;color:var(--sub);background:#f7f7f5;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:14px}
.ranges{display:grid;gap:7px}
.rangeRow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.rangeName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{border:0;background:transparent;color:#a34734;font-size:18px}
.empty{font-size:13px;color:var(--sub)}
.viewer{min-width:0;min-height:0;height:100%;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:100%}
.controls{
  background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;
  display:flex;flex-wrap:wrap;gap:9px;align-items:center
}
.switchWrap{display:flex;align-items:center;gap:7px;font-size:14px}
.switch{position:relative;width:44px;height:25px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#c9c5bd;border-radius:99px;transition:.2s}
.slider:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 4px #777;transition:.2s}
.switch input:checked+.slider{background:var(--accent)}
.switch.green input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(19px)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 11px}
.seg button.active{background:#25231f;color:#fff}
.action{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px}
.action.primary{background:#25231f;color:#fff;border-color:#25231f}
.pageInfo{margin-left:auto;color:var(--sub);font-size:13px}
.scroller{min-width:0;min-height:0;width:100%;height:100%;overflow:auto;padding:18px;display:flex;align-items:flex-start;justify-content:flex-start;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.stage{contain:layout paint style;transform-origin:0 0;position:relative;flex:0 0 auto;background:#fff;box-shadow:var(--shadow);touch-action:pan-x pan-y}
.stage img{display:block;width:100%;height:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
#overlayCanvas{pointer-events:none}
#drawCanvas{cursor:crosshair;pointer-events:none;touch-action:none}
.stage.drawing #drawCanvas{pointer-events:auto}
.stage.drawing{touch-action:none}
.stage.pinching{will-change:width}
.scroller.dragPanning{cursor:grabbing;user-select:none}
.scroller.dragPanning .stage{cursor:grabbing}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:var(--sub)}
.nav{
  background:#fff;border-top:1px solid var(--line);
  padding:9px max(10px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:8px;align-items:center
}
.nav button,.nav select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}
.zoom{display:flex;align-items:center;gap:8px}
#zoomLabel{min-width:44px;text-align:center}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#25231f;color:#fff;padding:9px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:100}
.toast.show{opacity:1}
@media(max-width:760px){
  .main.sideClosed{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
  .sideToggleBtn{display:none!important}
  .main{display:grid;grid-template-columns:minmax(0,1fr);width:100%;min-height:0}
  .side{display:none}
  .top{font-size:14px}
  .siteBrand span{display:none}.siteBrand img{width:27px;height:27px}
  .regionTitle{max-width:32vw;overflow:hidden;text-overflow:ellipsis}
  .homeBtn{padding:6px 8px}
  .privacy{display:none}
  .controls{padding:7px;gap:7px}
  .controls .action{padding:7px 9px}
  .pageInfo{width:100%;margin:0;text-align:right}

  .nav{gap:5px}
  .nav button,.nav select{font-size:14px;padding:8px}
}
</style>

let pinchStartDistance=0, pinchStartZoom=100, pinchStartScrollLeft=0, pinchStartScrollTop=0;
let pinchCenterX=0, pinchCenterY=0;
function touchDistance(touches){
  const dx=touches[0].clientX-touches[1].clientX;
  const dy=touches[0].clientY-touches[1].clientY;
  return Math.hypot(dx,dy);
}

  if(e.touches.length!==2 || drawing)return;

  pinchStartZoom=zoom;
  pendingPinchZoom=zoom;
  pinchStartScrollLeft=scroller.scrollLeft;
  pinchStartScrollTop=scroller.scrollTop;
  pinchCenterX=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left;
  pinchCenterY=(e.touches[0].clientY+e.touches[1].clientY)/2-rect.top;
  stage.classList.add('pinching');
  e.preventDefault();
}
function flushPinch(){
  pinchFrame=0;

  applyZoom();
  const ratio=zoom/pinchStartZoom;
  scroller.scrollLeft=(pinchStartScrollLeft+pinchCenterX)*ratio-pinchCenterX;

}
function movePinch(e){

  pendingPinchZoom=Math.max(50,Math.min(200,Math.round((pinchStartZoom*touchDistance(e.touches)/pinchStartDistance)*2)/2));

  if(!pinchFrame) pinchFrame=requestAnimationFrame(flushPinch);
}
function endPinch(e){
  if(e.touches.length<2){
    if(pinchFrame){cancelAnimationFrame(pinchFrame);flushPinch();}
    pinchStartDistance=0;
    stage.classList.remove('pinching');
  }
}

  const canX=scrollerEl.scrollWidth>scrollerEl.clientWidth+1;
  if(!canY&&!canX)return;
  if(canY&&Math.abs(e.deltaY)>=Math.abs(e.deltaX)) scrollerEl.scrollTop+=e.deltaY;
  else if(canX) scrollerEl.scrollLeft+=(e.deltaX||e.deltaY);
  e.preventDefault();
},{passive:false});
let dragPanActive=false,dragPanPointerId=null,dragPanStartX=0,dragPanStartY=0,dragPanScrollLeft=0,dragPanScrollTop=0;
function beginDragPan(e){
  if(drawing)return;
  if(e.pointerType==='touch')return; // touchはブラウザ標準の1本指スクロールを使う
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(scrollerEl.scrollWidth<=scrollerEl.clientWidth&&scrollerEl.scrollHeight<=scrollerEl.clientHeight)return;
  dragPanActive=true;dragPanPointerId=e.pointerId;
  dragPanStartX=e.clientX;dragPanStartY=e.clientY;
  dragPanScrollLeft=scrollerEl.scrollLeft;dragPanScrollTop=scrollerEl.scrollTop;
  scrollerEl.classList.add('dragPanning');
  scrollerEl.setPointerCapture?.(e.pointerId);
  e.preventDefault();
}
function moveDragPan(e){
  if(!dragPanActive||e.pointerId!==dragPanPointerId)return;
  scrollerEl.scrollLeft=dragPanScrollLeft-(e.clientX-dragPanStartX);
  scrollerEl.scrollTop=dragPanScrollTop-(e.clientY-dragPanStartY);
  e.preventDefault();
}
function endDragPan(e){
  if(!dragPanActive||e.pointerId!==dragPanPointerId)return;
  dragPanActive=false;dragPanPointerId=null;
  scrollerEl.classList.remove('dragPanning');
  try{scrollerEl.releasePointerCapture?.(e.pointerId)}catch(_e){}
}
scrollerEl.addEventListener('pointerdown',beginDragPan,{passive:false});
scrollerEl.addEventListener('pointermove',moveDragPan,{passive:false});
scrollerEl.addEventListener('pointerup',endDragPan,{passive:true});
scrollerEl.addEventListener('pointercancel',endDragPan,{passive:true});
scrollerEl.addEventListener('touchstart',beginPinch,{passive:false});
scrollerEl.addEventListener('touchmove',movePinch,{passive:false});
scrollerEl.addEventListener('touchend',endPinch,{passive:true});
scrollerEl.addEventListener('touchcancel',endPinch,{passive:true});
syncSide();
loadPage();
</script>
