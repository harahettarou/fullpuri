<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>教材ライブラリ｜古プリ</title><link rel="icon" href="../assets/icons/favicon.ico"><link rel="stylesheet" href="../assets/materials/materials_v15.css"></head><body><main class="ml-wrap">
<header class="ml-hero"><nav class="ml-nav"><a href="../index.html">古プリ一覧</a><a href="review.html">復習管理</a><a href="notes.html">メモ一覧</a></nav><span class="ml-badge">教科をこえて、自分たちの教材へ</span><h1>教材ライブラリ</h1><p>PDFを教科・フォルダーで整理。色文字を加えて、復習とメモを続けられます。</p></header>
<section class="ml-panel"><div id="account" class="ml-row"></div><p id="status" class="ml-status" role="status" aria-live="polite">読み込み中…</p><p id="notice" class="ml-error" role="alert"></p><button id="reload">教材を再読み込み</button></section>
<details id="uploadPanel" class="ml-panel" hidden><summary>＋ 教材を追加（管理者）</summary><p class="ml-meta">原本PDFをそのまま保存します。1ファイル50MB・1000ページまで。追加直後は下書きで、公開するまで他の人には表示されません。</p><form id="uploadForm" class="ml-form"><label>PDF<input id="file" type="file" accept="application/pdf,.pdf" required></label><label>教材名<input id="title" maxlength="200" required></label><label>教科<input id="subjectInput" maxlength="60" list="subjects" placeholder="例：英語、数学、日本史" required></label><label>フォルダー<input id="folderInput" maxlength="100" list="folders" placeholder="例：2学期／文法"></label><datalist id="subjects"></datalist><datalist id="folders"></datalist><button id="upload" class="primary" type="submit">PDFを保存して編集へ</button><p id="uploadStatus" class="ml-status" role="status" aria-live="polite"></p></form></details>
<section class="ml-panel ml-row" aria-label="教材の絞り込み"><label>教科<select id="subject"><option value="">すべて</option></select></label><label>フォルダー<select id="folder"><option value="">すべて</option></select></label><label>検索<input id="query" type="search" placeholder="教材名・教科"></label><label id="stateLabel" hidden>状態<select id="state"><option value="active">使用中</option><option value="draft">下書き</option><option value="published">公開中</option><option value="archived">アーカイブ</option><option value="all">すべて</option></select></label></section>
<p id="count" class="ml-meta"></p><section id="list" class="ml-grid" aria-label="教材一覧"></section><button id="more" hidden>さらに表示</button>
</main><script type="module" src="../assets/materials/library_v15.js"></script></body></html>
