<style>
:root{--bg:#f5f3ee;--panel:#fff;--ink:#25231f;--sub:#6f6a61;--line:#ddd7cd;--accent:#de6f3c;--green:#16866f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:max(14px,env(safe-area-inset-top)) 16px 14px}.head{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;font-weight:900}.brand img{width:32px;height:32px;border-radius:8px}.modes{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}.modes a,.modes span{color:inherit;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px;font-weight:800}.modes .active{background:var(--accent);border-color:var(--accent);color:#fff}main{max-width:980px;margin:auto;padding:22px 16px 48px}h1{font-size:clamp(24px,5vw,36px);margin:0 0 8px}.lead{color:var(--sub);line-height:1.7}.searchBox{position:sticky;top:72px;z-index:8;background:var(--bg);padding:8px 0 12px}.search{width:100%;border:2px solid var(--line);border-radius:14px;background:#fff;padding:14px 16px;font-size:18px;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(222,111,60,.16)}.status{font-size:13px;color:var(--sub);margin:7px 2px 0}.results{display:grid;gap:10px}.result{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:13px;padding:13px 14px;box-shadow:0 5px 18px rgba(34,28,20,.06)}.result:active{transform:scale(.99)}.topline{display:flex;gap:10px;align-items:center}.label{font-weight:900}.unit{color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{margin-left:auto;color:var(--green);font-size:12px;font-weight:800}.context{margin-top:8px;line-height:1.65;overflow-wrap:anywhere}.hint{color:var(--sub);text-align:center;padding:35px 12px}.mark{background:#fff1a8;border-radius:4px;padding:0 2px}@media(max-width:620px){header{padding-inline:8px}.head{gap:6px}.brand span{font-size:15px}.brand img{width:28px;height:28px}.modes{width:100%;margin:0;display:grid;grid-template-columns:repeat(4,1fr)}.modes a,.modes span{text-align:center;font-size:10px;padding:7px 3px}.searchBox{top:105px}main{padding:16px 9px 38px}.search{font-size:16px}.result{padding:11px}.topline{align-items:flex-start;flex-wrap:wrap}.score{margin-left:0}.unit{width:100%}}

</style></head><body><header><div class="head"><a class="siteBrand" href="../index.html" aria-label="古プリ比較システムのトップページ"><img src="../assets/icons/icon-192.png" alt=""><span>古プリ比較システム</span></a><nav class="modeNav" aria-label="閲覧方法"><a href="../index.html">ナンバー順</a><a href="regional.html">地域・時代順</a><a href="centuries.html">世紀別</a><span class="active" aria-current="page">文字検索</span><a href="timeline.html">総合年表</a></nav></div></header><main><h1>画像内文字検索</h1><p class="lead">プリント画像の印刷文字と手書き文字をOCRで読み取って検索します。少し違う文字でも候補を表示し、開いたページで該当位置を赤枠で示します。</p><div class="searchBox"><input id="q" class="search" type="search" inputmode="search" autocomplete="off" placeholder="例：アヘン戦争、ルネサンス、ウィーン体制" aria-label="画像内の文字を検索"><div id="status" class="status">検索データを読み込み中…</div></div><div id="results" class="results"><div class="hint">文字を入力してください。</div></div></main>
<script>
const input=document.getElementById('q'),status=document.getElementById('status'),results=document.getElementById('results');let pages=[];let timer=0;
function norm(value){return value.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).replace(/[^0-9a-zぁ-ん一-龯々〆ヵヶ]+/g,'')}
function grams(value){const size=value.length<5?2:3,out=[];if(value.length<=size)return[value];for(let i=0;i<=value.length-size;i++)out.push(value.slice(i,i+size));return out}
function fuzzy(query,text){if(text.includes(query))return 1;if(query.length<3)return 0;const qg=grams(query),set=new Set(qg),size=query.length,bestFloor=query.length<=4?.62:.48;let best=0;for(let start=0;start<text.length;start++){for(let delta=-2;delta<=2;delta++){const part=text.slice(start,start+size+delta);if(part.length<Math.max(2,size-2))continue;const pg=grams(part);let common=0;for(const g of pg)if(set.has(g))common++;const score=2*common/(qg.length+pg.length);if(score>best)best=score;if(best>=.96)return best}}return best>=bestFloor?best:0}
function escapeHtml(value){return value.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function render(){const query=norm(input.value);if(!query){status.textContent=`${pages.length}ページの画像内文字を検索できます。`;results.innerHTML='<div class="hint">文字を入力してください。</div>';return}const found=[];for(const page of pages){let best=null;for(const line of page.lines){const score=fuzzy(query,line.n);if(score&&(!best||score>best.score))best={line,score}}if(best)found.push({page,...best})}found.sort((a,b)=>b.score-a.score||a.page.no-b.page.no);const shown=found.slice(0,80);status.textContent=found.length?`${found.length}ページで候補が見つかりました${found.length>80?'（上位80件）':''}`:'候補が見つかりませんでした。文字を短くして試してください。';results.innerHTML=shown.length?shown.map(({page,line,score})=>{const hit=[line.x,line.y,line.w,line.h].join(',');const href=`${page.href}?page=${encodeURIComponent(page.key)}&hit=${hit}&q=${encodeURIComponent(input.value.trim())}`;return`<a class="result" href="${href}"><div class="topline"><span class="label">${escapeHtml(page.label)}</span><span class="unit">${escapeHtml(page.unit)}</span><span class="score">${score===1?'一致':'近い候補'}</span></div><div class="context">${escapeHtml(line.t)}</div></a>`}).join(''):'<div class="hint">別の言葉でも試してみてください。</div>'}
input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,160)});fetch('../assets/search/ocr-index.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{pages=data.pages;const initial=new URLSearchParams(location.search).get('q')||'';input.value=initial;render();if(initial)input.focus()}).catch(()=>{status.textContent='検索データを読み込めませんでした。'});
</script></body></html>
