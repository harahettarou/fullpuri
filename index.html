<head>

<title>古プリ比較システム</title>

<style>
:root{--bg:#f5f3ee;--panel:#fff;--ink:#25231f;--sub:#6f6a61;--line:#ddd7cd;--accent:#de6f3c;--green:#16866f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:max(14px,env(safe-area-inset-top)) 16px 14px}
.head{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.siteBrand{display:inline-flex;align-items:center;gap:9px;color:inherit;text-decoration:none;font-size:20px;font-weight:900;white-space:nowrap}.siteBrand img{width:32px;height:32px;border-radius:8px;object-fit:cover;flex:0 0 auto}
.modeNav{margin-left:auto;display:flex;background:#eeeae3;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.modeNav a,.modeNav span{text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;padding:7px 11px;border-radius:9px;white-space:nowrap}.modeNav .active{background:#fff;box-shadow:0 2px 8px rgba(34,28,20,.08);color:var(--accent)}
main{max-width:980px;margin:auto;padding:22px 16px 48px}.lead{color:var(--sub);line-height:1.7;margin:0 0 16px}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;font-size:16px;outline:none;margin-bottom:16px}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(222,111,60,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 7px 22px rgba(34,28,20,.06)}.card:focus-visible{outline:3px solid rgba(222,111,60,.35);outline-offset:2px}.card:active{transform:scale(.985)}.range{font-weight:900;font-size:18px}.title{margin-top:5px;line-height:1.45}.meta{margin-top:10px;color:var(--sub);font-size:12px}.empty{display:none;text-align:center;color:var(--sub);padding:32px}footer{color:var(--sub);font-size:12px;margin-top:22px;text-align:center}footer a{color:var(--green);overflow-wrap:anywhere}


@media(max-width:620px){.modeNav{width:100%;margin-left:0}.modeNav a,.modeNav span{flex:1;text-align:center;font-size:10px;padding-inline:2px}}
/* ===== index.html coordinate lock v5 ===== */
html{
  overflow-y:scroll;
  scrollbar-gutter:stable;
}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:max(14px,env(safe-area-inset-top)) 16px 14px;
}
header>.head{
  width:100%;
  max-width:980px;
  margin-left:auto;
  margin-right:auto;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
header .siteBrand{
  display:inline-flex;
  align-items:center;
  gap:9px;
  color:inherit;
  text-decoration:none;
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
  margin:0;
  padding:0;
}
header .siteBrand img{
  width:32px;
  height:32px;
  border-radius:8px;
  object-fit:cover;
  flex:0 0 auto;
  margin:0;
  padding:0;
}
header .modeNav{
  margin-left:auto;
  margin-right:0;
  display:flex;
  align-items:center;
  background:#eeeae3;
  border:1px solid var(--line);
  border-radius:12px;
  padding:3px;
  gap:3px;
}
header .modeNav a,
header .modeNav span{
  display:block;
  text-decoration:none;
  color:var(--ink);
  font-weight:800;
  font-size:14px;
  line-height:20px;
  padding:7px 11px;
  border-radius:9px;
  white-space:nowrap;
  margin:0;
}
header .modeNav .active{
  background:#fff;
  box-shadow:0 2px 8px rgba(34,28,20,.08);
  color:var(--accent);
}
body>main{
  width:100%;
  max-width:980px;
  margin-left:auto;
  margin-right:auto;
  padding:22px 16px 48px;
}

@media(max-width:620px){
  html{
    overflow-y:auto;
    scrollbar-gutter:auto;
  }
  header .modeNav{
    width:100%;
    margin-left:0;
    margin-right:0;
  }
  header .modeNav a,
  header .modeNav span{
    flex:1;
    text-align:center;
    font-size:10px;
    line-height:20px;
    padding-left:2px;
    padding-right:2px;
  }
}
/* ===== end coordinate lock v5 ===== */


/* ===== HUB COORDINATE LOCK v6 ===== */
html{overflow-y:scroll;scrollbar-gutter:stable}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.94);

  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);

header>.head{

  display:inline-flex;

}

</style>
</head>
<body>
<header><div class="head"><a class="siteBrand" href="./" aria-label="古プリ比較システムのトップページ"><img src="assets/icons/icon-192.png" alt=""><span>古プリ比較システム</span></a><nav class="modeNav" aria-label="閲覧方法"><span class="active" aria-current="page">ナンバー順</span><a href="pages/regional.html">地域・時代順</a><a href="pages/centuries.html">世紀別</a><a href="pages/search.html">文字検索</a><a href="pages/timeline.html">総合年表</a></nav></div></header>
<main><p class="lead">学習したい範囲を選択してください。No.または単元名で絞り込めます。</p><input class="search" id="search" type="search" inputmode="search" placeholder="例：85、ルネサンス、中国史" aria-label="問題番号または単元名で検索"><div class="grid" id="grid"></div><div class="empty" id="empty">該当する範囲がありません。</div><footer><a href="https://harahettarou.github.io/fullpuri/">https://harahettarou.github.io/fullpuri/</a></footer></main>
<script>
const grid=document.getElementById("grid"),search=document.getElementById("search"),empty=document.getElementById("empty");let ranges=[];
function render(q=""){const needle=q.trim().toLowerCase().replace(/^no\.?/,"");const items=ranges.filter(x=>{const nums=[];for(let n=x.start;n<=x.end;n++)nums.push(String(n));return !needle||x.title.toLowerCase().includes(needle)||x.id.toLowerCase().includes(needle)||nums.includes(needle)});grid.innerHTML=items.map(x=>`<a class="card" href="${x.file}"><div class="range">${x.start===x.end?`No.${x.start}`:`No.${x.start}〜${x.end}`}</div><div class="title">${x.title}</div><div class="meta">${x.pages}ページ</div></a>`).join("");empty.style.display=items.length?"none":"block"}
fetch("manifest.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(m=>{ranges=m.ranges;render()}).catch(()=>{empty.textContent="一覧データを読み込めませんでした。";empty.style.display="block"});search.addEventListener("input",()=>render(search.value));
</script>
</body>
</html>
