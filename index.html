<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f3ee"><title>古プリ比較システム</title>
<style>:root{--bg:#f5f3ee;--panel:#fff;--ink:#25231f;--sub:#6f6a61;--line:#ddd7cd;--accent:#de6f3c;--green:#16866f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:max(14px,env(safe-area-inset-top)) 16px 14px}.head{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px}.brand{font-size:20px;font-weight:900}main{max-width:980px;margin:auto;padding:22px 16px 48px}.lead{color:var(--sub);line-height:1.7;margin:0 0 16px}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;font-size:16px;outline:none;margin-bottom:16px}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(222,111,60,.15)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 7px 22px rgba(34,28,20,.06)}.card:active{transform:scale(.985)}.range{font-weight:900;font-size:18px}.title{margin-top:5px;line-height:1.45}.meta{margin-top:10px;color:var(--sub);font-size:12px}.empty{display:none;text-align:center;color:var(--sub);padding:32px}footer{color:var(--sub);font-size:12px;margin-top:22px;text-align:center}</style></head>
<body><header><div class="head"><div class="brand">古プリ比較システム</div></div></header><main><p class="lead">学習したい範囲を選択してください。No.または単元名で絞り込めます。</p><input class="search" id="search" type="search" inputmode="search" placeholder="例：85、ルネサンス、中国史" aria-label="問題番号または単元名で検索"><div class="grid" id="grid"></div><div class="empty" id="empty">該当する範囲がありません。</div></main>
<script>const grid=document.getElementById("grid"),search=document.getElementById("search"),empty=document.getElementById("empty");let ranges=[];function render(q=""){const needle=q.trim().toLowerCase().replace(/^no\.?/,"");const items=ranges.filter(x=>{const nums=[];for(let n=x.start;n<=x.end;n++)nums.push(String(n));return !needle||x.title.toLowerCase().includes(needle)||x.id.toLowerCase().includes(needle)||nums.includes(needle)});grid.innerHTML=items.map(x=>`<a class="card" href="${x.file}"><div class="range">${x.start===x.end?`No.${x.start}`:`No.${x.start}〜${x.end}`}</div><div class="title">${x.title}</div><div class="meta">${x.pages}ページ</div></a>`).join("");empty.style.display=items.length?"none":"block"}fetch("manifest.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(m=>{ranges=m.ranges;render()}).catch(()=>{empty.textContent="一覧データを読み込めませんでした。";empty.style.display="block"});search.addEventListener("input",()=>render(search.value));</script></body></html>
